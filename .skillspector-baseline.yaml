version: 2
rules:
  - id: TM1
    path: package.json
    message: "*rm -*"
    reason: >-
      The `plugin` npm script deletes the plugin/scripts build output dir
      before rolldown rewrites it. Maintainer-only dev tooling; never runs
      when the skill is installed or used.
  - id: TM2
    path: package.json
    message: "*rm -*"
    reason: >-
      Same `plugin` build script: the delete of plugin/scripts is chained
      after the vite build. Maintainer-only dev tooling; never runs when the
      skill is installed or used.
